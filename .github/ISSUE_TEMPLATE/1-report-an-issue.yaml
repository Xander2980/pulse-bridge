name: Problem Report
description: Report a technical problem with the Pulse Bridge for Tibber integration (unofficial project, not a Tibber service).
body:
  - type: markdown
    attributes:
      value: |
        Most reading problems are solved by one of these two steps:
        - slightly rotate the Pulse reading head anti-clockwise, or
        - replace the batteries of the Pulse.

        See [Troubleshooting & FAQ](https://github.com/Xander2980/pulse-bridge/blob/main/docs/troubleshooting.md) before opening an issue.
        Remove passwords, IP addresses and WiFi names from everything you post.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have read [CONTRIBUTING.md](https://github.com/Xander2980/pulse-bridge/blob/main/CONTRIBUTING.md) and searched the existing issues.
          required: true
        - label: I have completed the [preparation steps](https://github.com/Xander2980/pulse-bridge/blob/main/docs/preparation.md), including the verification parts.
          required: true
        - label: I use the latest release of the integration and a supported Home Assistant version.
          required: true
        - label: I attach a debug log ([how to enable debug logging](https://github.com/Xander2980/pulse-bridge/blob/main/docs/troubleshooting.md#enable-debug-logging)). Attachments sent by e-mail reply to a notification are dropped by GitHub.
          required: true
  - type: input
    id: version
    attributes:
      label: Versions
      placeholder: "Integration 1.0.0, Home Assistant 2026.11.x, bridge firmware ..."
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: Description
      placeholder: "What happens, what did you expect, and how can the problem be reproduced?"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug log
      placeholder: "Paste the relevant debug log output. It is formatted as code automatically."
      render: shell
