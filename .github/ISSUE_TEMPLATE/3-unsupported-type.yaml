name: Unsupported Protocol Report
description: The host and password are correct, but the integration cannot read data from your Pulse / meter.
labels: enhancement
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I use the latest release of the integration and a supported Home Assistant version.
          required: true
        - label: I have checked whether the problem also occurs with another node number (2, 3 or 4 instead of 1).
          required: true
        - label: I attach a debug log ([how to enable debug logging](https://github.com/Xander2980/pulse-bridge/blob/main/docs/troubleshooting.md#enable-debug-logging)).
          required: true
  - type: dropdown
    id: system
    attributes:
      label: Meter type
      description: |
        Shown on `http://<bridge-ip>/pulse/1/config` (older firmware: `http://<bridge-ip>/nodes/1/config`).
      multiple: false
      options:
        - Auto scan mode
        - IEC-62056-21 (IR)
        - Logarex
        - SML 1.04
        - Impressions (Blinks / kwh) using ambient sensor
        - Impressions (Blinks / kwh) using ir sensor
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Bridge data output
      description: |
        Output of `http://<bridge-ip>/pulse/1/data` or `http://<bridge-ip>/node_data.json?node_id=1`
        (older firmware: `http://<bridge-ip>/nodes/1/data` or `http://<bridge-ip>/data.json?node_id=1`).
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Debug log
      render: shell
  - type: textarea
    id: content
    attributes:
      label: Additional information
