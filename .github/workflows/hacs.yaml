name: HACS Action

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
  - cron: "0 0 * * *"

jobs:
  hacs:
    name: HACS Action
    if: github.repository == 'Xander2980/pulse-bridge'
    runs-on: "ubuntu-latest"
    steps:
    - uses: "actions/checkout@v6"
    - name: HACS Action
      uses: "hacs/action@main"
      with:
        category: "integration"
